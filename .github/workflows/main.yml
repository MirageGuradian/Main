name: RDP via Tailscale

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'عدد ساعات التشغيل (1-6)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: ضبط مدة التشغيل تلقائياً
      run: |
        $hours = "${{ github.event.inputs.hours || '3' }}"
        echo "DURATION_HOURS=$hours" >> $env:GITHUB_ENV

    - name: تمكين سطح المكتب البعيد
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        netsh advfirewall firewall add rule name="RDP-Port" dir=in action=allow protocol=TCP localport=3389

    - name: إنشاء مستخدم محلي (طريقة NET USER - تعمل 100%)
      run: |
        $username = "rdpuser"
        $password = "WindowsRDP#2025!@#"
        
        # حذف المستخدم إذا كان موجوداً
        net user $username /delete 2>$null
        
        # إنشاء مستخدم جديد
        net user $username $password /add /expires:never /passwordchg:no
        
        # إضافة المستخدم إلى المجموعات
        net localgroup Administrators $username /add
        net localgroup "Remote Desktop Users" $username /add
        
        # تخزين بيانات الدخول
        echo "RDP_USER=$username" >> $env:GITHUB_ENV
        echo "RDP_PASS=$password" >> $env:GITHUB_ENV
        
        Write-Host "✅ User created successfully using NET USER!" -ForegroundColor Green

    - name: تعطيل جدار الحماية و Windows Defender
      run: |
        # تعطيل Windows Defender مؤقتاً
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
        Set-MpPreference -DisableBlockAtFirstSeen $true -ErrorAction SilentlyContinue
        Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
        
        # تعطيل الجدار الناري
        netsh advfirewall set allprofiles state off
        
        Write-Host "✅ Firewall and Defender disabled" -ForegroundColor Green

    - name: تحميل وتثبيت Tailscale
      run: |
        Write-Host "📥 Downloading Tailscale..." -ForegroundColor Yellow
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale.exe"
        
        Write-Host "⚙️ Installing Tailscale..." -ForegroundColor Yellow
        Start-Process -FilePath "$env:TEMP\tailscale.exe" -ArgumentList "/quiet" -Wait -NoNewWindow
        Start-Sleep -Seconds 15
        
        Write-Host "✅ Tailscale installed" -ForegroundColor Green

    - name: الاتصال بشبكة Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        Write-Host "🔗 Connecting to Tailscale network..." -ForegroundColor Yellow
        
        # الاتصال بـ Tailscale
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname="github-rdp-${{ github.run_id }}"
        
        # انتظار الاتصال
        Start-Sleep -Seconds 10
        
        # الحصول على عنوان IP
        $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        echo "TAILSCALE_IP=$ts_ip" >> $env:GITHUB_ENV
        
        Write-Host "✅ Connected! IP: $ts_ip" -ForegroundColor Green

    - name: تثبيت برامج إضافية (اختياري)
      run: |
        # تثبيت Google Chrome
        Write-Host "🌐 Installing Google Chrome..." -ForegroundColor Yellow
        $chromeInstaller = "$env:TEMP\chrome_installer.exe"
        Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromeInstaller -ErrorAction SilentlyContinue
        Start-Process -FilePath $chromeInstaller -ArgumentList "/silent /install" -Wait -NoNewWindow -ErrorAction SilentlyContinue
        
        # تثبيت 7-Zip
        Write-Host "📦 Installing 7-Zip..." -ForegroundColor Yellow
        Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2409-x64.exe" -OutFile "$env:TEMP\7zip.exe" -ErrorAction SilentlyContinue
        Start-Process -FilePath "$env:TEMP\7zip.exe" -ArgumentList "/S" -Wait -NoNewWindow -ErrorAction SilentlyContinue
        
        Write-Host "✅ Additional software installed" -ForegroundColor Green

    - name: عرض معلومات الاتصال
      run: |
        Clear-Host
        Write-Host ""
        Write-Host "╔════════════════════════════════════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║                    ✅ RDP CONNECTION INFO ✅                       ║" -ForegroundColor Cyan
        Write-Host "╚════════════════════════════════════════════════════════════════════╝" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "  ╔══════════════════════════════════════════════════════════════╗" -ForegroundColor Yellow
        Write-Host "  ║  🌐 SERVER ADDRESS (Tailscale IP):                           ║" -ForegroundColor Yellow
        Write-Host "  ║      $env:TAILSCALE_IP" -ForegroundColor Green
        Write-Host "  ║                                                              ║" -ForegroundColor Yellow
        Write-Host "  ║  👤 USERNAME:                                                ║" -ForegroundColor Yellow
        Write-Host "  ║      $env:RDP_USER" -ForegroundColor Green
        Write-Host "  ║                                                              ║" -ForegroundColor Yellow
        Write-Host "  ║  🔑 PASSWORD:                                                ║" -ForegroundColor Yellow
        Write-Host "  ║      $env:RDP_PASS" -ForegroundColor Green
        Write-Host "  ║                                                              ║" -ForegroundColor Yellow
        Write-Host "  ║  🚪 PORT: 3389                                              ║" -ForegroundColor Yellow
        Write-Host "  ║  ⏱️  DURATION: $env:DURATION_HOURS hour(s)        ║" -ForegroundColor Yellow
        Write-Host "  ╚══════════════════════════════════════════════════════════════╝" -ForegroundColor Yellow
        Write-Host ""
        Write-Host "╔════════════════════════════════════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║  📝 HOW TO CONNECT:                                                ║" -ForegroundColor White
        Write-Host "║  1. Press Win + R and type 'mstsc'                                 ║" -ForegroundColor White
        Write-Host "║  2. Enter the Server Address above                                 ║" -ForegroundColor White
        Write-Host "║  3. Enter Username and Password                                    ║" -ForegroundColor White
        Write-Host "║  4. Click 'Yes' if certificate warning appears                     ║" -ForegroundColor White
        Write-Host "╚════════════════════════════════════════════════════════════════════╝" -ForegroundColor Cyan
        Write-Host ""
        
        # حفظ معلومات الاتصال على سطح المكتب
        $DesktopPath = [Environment]::GetFolderPath("Desktop")
        $InfoFile = Join-Path $DesktopPath "RDP_Connection_Info.txt"
        
        $ConnectionInfo = @"
========================================
     RDP CONNECTION INFORMATION
========================================
Server IP: $env:TAILSCALE_IP
Port: 3389
Username: $env:RDP_USER
Password: $env:RDP_PASS
Duration: $env:DURATION_HOURS hours
========================================
How to connect:
1. Open Remote Desktop Connection (mstsc)
2. Enter the server IP address
3. Enter username and password
4. Click Yes for certificate warning
========================================
"@
        
        $ConnectionInfo | Out-File -FilePath $InfoFile -Encoding UTF8
        Write-Host "✅ Connection info saved to: $InfoFile" -ForegroundColor Green

    - name: الحفاظ على تشغيل السيرفر
      run: |
        $hours = $env:DURATION_HOURS
        $totalMinutes = $hours * 60
        
        Write-Host ""
        Write-Host "🚀 SERVER IS NOW RUNNING!" -ForegroundColor Green
        Write-Host "⏰ Will run for $hours hour(s)" -ForegroundColor Yellow
        Write-Host "💡 You can close this window, the server will keep running" -ForegroundColor Cyan
        Write-Host "🔌 To stop early, cancel this workflow in GitHub" -ForegroundColor Cyan
        Write-Host ""
        
        for ($i = $totalMinutes; $i -gt 0; $i--) {
            $remainingHours = [math]::Floor($i / 60)
            $remainingMinutes = $i % 60
            $percentComplete = (($totalMinutes - $i) / $totalMinutes) * 100
            
            Write-Progress -Activity "🖥️  RDP Server Running" -Status "⏳ Time Left: $remainingHours h $remainingMinutes m" -PercentComplete $percentComplete -CurrentOperation "Connect: $env:TAILSCALE_IP"
            
            Start-Sleep -Seconds 60
        }
        
        Write-Host ""
        Write-Host "⏰ Time's up! Server is shutting down..." -ForegroundColor Red
        Write-Host "👋 Thank you for using RDP service" -ForegroundColor Yellow
